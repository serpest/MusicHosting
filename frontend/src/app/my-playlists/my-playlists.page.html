<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>MyPlaylists</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">MyPlaylists</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <h1>My playlists</h1>
    <app-playlist-list [playlists]="myPlaylists"></app-playlist-list>    
  </ion-content>
</ion-content>
