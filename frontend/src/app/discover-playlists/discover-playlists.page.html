<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>DiscoverPlaylists</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">DiscoverPlaylists</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <h1>Discover new playlists</h1>
    <app-playlist-list [playlists]="randomPlaylists"></app-playlist-list>
  </ion-content>
</ion-content>
