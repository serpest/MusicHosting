<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>DiscoverSongs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">DiscoverSongs</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <h1>Discover new songs</h1>
    <app-song-list [songs]="randomSongs"></app-song-list>
  </ion-content>
</ion-content>
