
<ion-menu side="start" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-menu-toggle>
      <ion-button expand="block" [routerLink]="['/discover-songs']">Discover songs</ion-button>
      <ion-button expand="block" [routerLink]="['/search-songs']">Search songs</ion-button>
      <ion-button expand="block" [routerLink]="['/my-songs']">My songs</ion-button>
      <ion-button expand="block" [routerLink]="['/upload-song']">Upload song</ion-button>
      <ion-button expand="block" [routerLink]="['/discover-playlists']">Discover playlists</ion-button>
      <ion-button expand="block" [routerLink]="['/my-playlists']">My playlists</ion-button>
      <ion-button expand="block" [routerLink]="['/create-playlist']">Create playlist</ion-button>
      <ion-button expand="block" [routerLink]="['/manage-account']">Manage account</ion-button>
      <ion-button *ngIf="!isLoggedIn" expand="block" [routerLink]="['/auth/login']">Login</ion-button>
      <ion-button *ngIf="!isLoggedIn" expand="block" [routerLink]="['/auth/register']">Register</ion-button>
      <ion-button *ngIf="isLoggedIn" expand="block" (click)="logout()">Logout</ion-button>
    </ion-menu-toggle>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>MusicHosting</ion-title>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-app>
    <ion-router-outlet [animated]="false"></ion-router-outlet>
  </ion-app>
</div>
