<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>ForgotPassword</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">ForgotPassword</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <h1>Forgot Password</h1>
    <form id="forgot-password-form" [formGroup]="forgotPasswordForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" formControlName="email" required />
        @if (forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched) {
            <p class="error">Invalid email</p>
        }
        <button type="submit" (click)="submit()" [disabled]="forgotPasswordForm.invalid">Submit</button>
    </form>
    <div id="switch-to-login">
        <span>Already have an account?</span>
        <button (click)="switchToLogin()">Login</button>
    </div>
  </ion-content>
</ion-content>
