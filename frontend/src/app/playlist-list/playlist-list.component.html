<ol class="list">
  @for (playlist of playlists(); track playlist.id) {
    <li class="playlist">
      <h2>{{ playlist.title }}</h2>
      <button (click)="open(playlist.id)" class="play-button">
        <span class="material-symbols-outlined play-icon">queue_music</span>
      </button>
    </li>
  }
</ol>
