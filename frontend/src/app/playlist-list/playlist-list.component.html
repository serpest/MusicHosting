<ol>
  <li class="playlist">
    <h2>Liked songs</h2>
    <button (click)="openLikedSongs()">Open</button>
  </li>
  @for (playlist of playlists(); track playlist.id) {
    <li class="playlist">
      <h2>{{ playlist.title }}</h2>
      <button (click)="open(playlist.id)">Open</button>
    </li>
  }
</ol>
