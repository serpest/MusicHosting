<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>  
  <ion-content class="ion-padding">
    <h1>Login</h1>
    <form id="login-form" [formGroup]="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" formControlName="email" required />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <p class="error">Invalid email</p>
        }
        <label for="password">Password</label>
        <input type="password" id="password" name="password" formControlName="password" required />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <p class="error">Passowrd length should be between 3 and 20 characters</p>
        }
        <button type="submit" (click)="submit()" [disabled]="loginForm.invalid">Submit</button>
    </form>
    <div id="switch-to-register">
        <span>Don't have an account?</span>
        <button (click)="switchToRegister()">Register</button>
    </div>
  </ion-content>
</ion-content>
